<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinque Menu Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column; sticky header with mode tabs; recipe cards styled like the bar's laminated sheet (black title bar, ruled lines). */
:root {
  --bg: #f2f1ef;
  --surface: #ffffff;
  --ink: #161312;
  --muted: #6d6662;
  --line: #dcd8d5;
  --red: #e30019;
  --bar: #161312;
  --bar-fg: #ffffff;
  --sel-bg: #161312;
  --sel-fg: #ffffff;
  --ok: #1d7f46;
  --ok-soft: #e3f3ea;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121010; --surface: #1c1918; --ink: #f2eeec; --muted: #a8a09b; --line: #36312f;
    --red: #ff3347; --bar: #2c2725; --bar-fg: #ffffff; --sel-bg: #f2eeec; --sel-fg: #161312;
    --ok: #52c785; --ok-soft: #173325; --bad: #ff7a72; --bad-soft: #3a1b19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121010; --surface: #1c1918; --ink: #f2eeec; --muted: #a8a09b; --line: #36312f;
  --red: #ff3347; --bar: #2c2725; --bar-fg: #ffffff; --sel-bg: #f2eeec; --sel-fg: #161312;
  --ok: #52c785; --ok-soft: #173325; --bad: #ff7a72; --bad-soft: #3a1b19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bar); color: var(--bar-fg);
  padding-inline: 16px;
}
.top-in { max-width: 720px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; padding-block: 10px 6px; }
.brand img { width: 36px; height: 36px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
.brand-name small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: .12em; opacity: .7; margin-top: 3px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
.tab {
  background: none; border: 0; color: var(--bar-fg); opacity: .65;
  padding: 10px 4px 12px; font-family: var(--font-display); font-weight: 800; font-size: 19px;
  letter-spacing: .06em; text-transform: uppercase; border-bottom: 4px solid transparent;
}
.tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--red); }

/* Page */
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }
section { display: grid; gap: 16px; }
.intro { margin: 0; color: var(--muted); font-size: 15px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 9px; font-weight: 600; }
.seg button.on { background: var(--sel-bg); color: var(--sel-fg); }

.btn {
  min-height: 46px; padding: 10px 18px; border-radius: 10px; border: 2px solid var(--sel-bg);
  background: var(--sel-bg); color: var(--sel-fg); font-weight: 700; font-size: 16px;
}
.btn.ghost { background: transparent; color: var(--ink); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; }

/* Recipe card, modelled on the bar sheet */
.rc { background: var(--surface); border: 2px solid var(--bar); border-radius: 4px; overflow: hidden; }
.rc-h {
  background: var(--bar); color: var(--bar-fg); padding: 6px 12px 5px;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .06em; text-transform: uppercase;
}
.rc-l { list-style: none; margin: 0; padding: 4px 12px; }
.rc-l li { display: flex; justify-content: space-between; gap: 12px; padding-block: 7px; border-bottom: 1px solid var(--line); font-weight: 600; }
.rc-l li:last-child { border-bottom: 0; }
.amt { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; white-space: nowrap; }
.rc-n { margin: 0; padding: 8px 12px 10px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rc-n b { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--ink); }

/* Study */
.flash {
  background: var(--surface); border: 2px solid var(--bar); border-radius: 6px; min-height: 300px;
  display: grid; align-content: center; gap: 14px; padding: 22px 18px; text-align: center; cursor: pointer;
}
.flash-count { font-size: 13px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.flash-name { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(40px, 12vw, 64px); line-height: .95; text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.flash .rc { text-align: left; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.search { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; align-items: start; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }

/* Build */
.pick { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.pick select { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; min-width: 0; }
.dname { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 10vw, 52px); line-height: .95; text-transform: uppercase; text-wrap: balance; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
.step-h { display: flex; align-items: baseline; gap: 10px; font-weight: 700; font-size: 17px; }
.step-n { font-family: var(--font-display); font-weight: 900; color: var(--red); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
.sub { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: 8px; }
.chip {
  min-height: 46px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); font-weight: 600; font-size: 15px; text-align: left; line-height: 1.2;
}
.chip.sel { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-bg); }
.chip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); }
.chip.missed { background: transparent; border: 2px dashed var(--ok); color: var(--ok); }
.chip.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); text-decoration: line-through; }
.chip.dim { opacity: .45; }
.chip:disabled { cursor: default; }
.chip .mk { float: right; font-weight: 700; margin-left: 6px; text-decoration: none; display: inline-block; }
.fb { margin: 0; padding: 10px 12px; border-radius: 8px; font-size: 15px; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.arow { display: grid; gap: 8px; padding-block: 10px; border-top: 1px solid var(--line); }
.arow:first-of-type { border-top: 0; padding-top: 0; }
.aname { font-weight: 700; }
.abtns { display: flex; flex-wrap: wrap; gap: 6px; }
.ab {
  min-width: 52px; min-height: 40px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--bg); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums;
}
.ab.sel { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-bg); }
.ares { font-size: 15px; padding: 8px 10px; border-radius: 8px; }
.ares.ok { background: var(--ok-soft); }
.ares.bad { background: var(--bad-soft); }

/* Quiz */
.qcard { background: var(--surface); border: 2px solid var(--bar); border-radius: 6px; padding: 18px 16px; display: grid; gap: 14px; }
.qkind { font-size: 12px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.qtext { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.qtext b { font-family: var(--font-display); font-weight: 900; font-size: 1.15em; text-transform: uppercase; letter-spacing: .02em; }
.qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.qlist li { padding: 6px 10px; background: var(--bg); border-radius: 6px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
.opts { display: grid; gap: 8px; }
.opt {
  min-height: 52px; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); text-align: left; font-weight: 600; font-size: 17px;
}
.opt.ok { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }

@media (prefers-reduced-motion: no-preference) {
  .chip, .ab, .opt, .btn, .tab { transition: background-color .15s, border-color .15s, opacity .15s; }
}
</style>

</head>

      <select id="bSelect" aria-label="Choose a drink"></select>
      <button id="bRandom" class="btn red">Random</button>
    </div>
    <div id="bStage" style="display:grid;gap:14px"></div>
  </section>

  <section id="quiz" hidden>
    <div id="qStage" style="display:grid;gap:14px"></div>
  </section>
</main>

<script>
// ---------- Recipe data ----------
// [name, [[display, amount, sheetText?, matchKey?], ...], [show-only notes]]
// amount: number (ml) | "top" | "dash" | "drops" | "squeeze" | null (ingredient only, no amount quizzed)
const RAW = [
  ["Apple Martini", [["Vodka",15],["Apple Liqueur",30],["Lime Juice",5],["Ginger Ale","top"]]],
  ["Around the World", [["Gin",45],["Get 27",15],["Pineapple Juice","top"]], ["Cherry garnish"]],
  ["Baileys Berry", [["Baileys",30],["Strawberry",15],["Milk","top"]]],
  ["Baileys Espresso", [["Vodka",15],["Baileys",30],["Iced Coffee","top"]]],
  ["Bananatini", [["Vodka",15],["Banana",30],["Milk","top"]]],
  ["Blueberrytini", [["Vodka",15],["Blueberry",30],["Blue Curacao",5],["Milk","top"]]],
  ["Butterscotch", [["Vodka",15],["Butterscotch",30],["Milk","top"]]],
  ["Cappuccinotini", [["Vodka",10],["Kahlua",10],["Baileys",10],["Frangelico",10],["Milk","top"]], ["Cinnamon powder on top"]],
  ["Cherry Blossom", [["Cherry Brandy",30],["Triple Sec",15],["Lemon Juice",5],["Cranberry Juice","top"]]],
  ["Chocolate Martini", [["Vodka",15],["Cacao Brown",30],["Milk","top"]]],
  ["Cinque House", [["Vodka",15],["Mangoyan",30],["Peachtree",15,null,"Peach"],["Orange Juice","top"],["Cranberry Juice","top"]]],
  ["Classic Gin", [["Gin",90],["Dry Vermouth",15],["Olive",null]]],
  ["Classic Vodka", [["Vodka",90],["Dry Vermouth",15],["Olive",null]]],
  ["Cosmopolitan", [["Vodka",30],["Triple Sec",15],["Lime Juice",5],["Cranberry Juice","top"]]],
  ["Deep Blue Sea", [["Vodka",30],["Blue Curacao",15],["Pineapple Juice","top"],["Lime Juice",5]]],
  ["Dirty Martini", [["Vodka",100],["Olive Brine",null]]],
  ["Dyldo", [["Vodka",30],["Vanilla","drops","3–5 drops"],["Lime Juice",5],["Ginger Ale","top"]], ["Stir"]],
  ["Espresso Martini", [["Vodka",30],["Kahlua",15],["Iced Coffee","top"]]],
  ["French Lychee", [["Vodka",15],["Lychee",30],["Cassis",10],["Pineapple Juice","top"],["Cranberry Juice","top"]]],
  ["Fruit Mega Mix", [["Peach",15],["Banana",15],["Melon",15],["Orange Juice","top"]]],
  ["Gimlet", [["Gin",90],["Lime Juice",15]]],
  ["Grasshopper", [["Vodka",15],["White Cacao",15],["Get 27",15],["Milk","top"]]],
  ["Hubba Bubba", [["Kahlua",20],["Banana",15],["Triple Sec",10],["Milk","top"]], ["Grenadine sugar rim"]],
  ["James Bond", [["Gin",60],["Vodka",60],["Cinzano Bianco",15]], ["Lemon peel twist"]],
  ["Lemon Drop", [["Vodka",15],["Citron Jenever",20],["Lemon Juice",15],["Grapefruit Juice","top"]], ["Sugar rim"]],
  ["Mai Tai", [["Bacardi",15],["Myers",15],["Triple Sec",15],["Malibu",15],["Orange Juice","top"],["Pineapple Juice","top"],["Grenadine","dash"]]],
  ["Mangotini", [["Vodka",15],["Mangoyan",30],["Orange Juice","top"]]],
  ["Manhattan", [["Jim Beam",90],["Cinzano Rosso",10],["Angostura Bitters","drops","2–3 drops"]]],
  ["Margarita", [["Tequila",45],["Triple Sec",30],["Lemon Juice",5],["Lime Juice",5]], ["Salt rim"]],
  ["Melon Ball", [["Vodka",15],["Melon",30],["Orange Juice","top"]]],
  ["Midori Splice", [["Bacardi",20],["Melon",20],["Malibu",15],["Pineapple Juice","top"],["Milk","dash"]]],
  ["Milky Way", [["Vodka",15],["White Cacao",15],["Baileys",15],["Milk","top"],["Vanilla","dash","3–4 dashes"]]],
  ["Mudslide", [["Vodka",15],["Baileys",15],["Kahlua",15],["Butterscotch",15],["Milk","top"],["Chocolate Syrup",null]]],
  ["Orange Blossom", [["Gin",30],["Triple Sec",15],["Orange Juice","top"]]],
  ["Peachteatini", [["Vodka",15],["Peach",30],["Oolong Tea",30],["Ginger Ale","dash","Splash"]]],
  ["Peachy", [["Peach",30],["Southern Comfort",15],["Grenadine",5],["Orange Juice","top"]]],
  ["Pine Vanilla", [["Vodka",45],["Pineapple Juice","top"],["Vanilla","dash","3–4 dashes"]]],
  ["Pink Pussycat", [["Gin",45],["Pineapple Juice","top"],["Grapefruit Juice","top"],["Grenadine","dash"]]],
  ["Pornstar", [["Vodka",30],["Vanilla","drops","5 drops"],["Passoa",30],["Lime Juice","dash"],["Orange Juice","top"]]],
  ["Purple Haze", [["Vodka",30],["Blue Curacao",15],["Cranberry Juice","top"]]],
  ["Rolls Royce", [["Gin",30],["Cinzano Dry",10,null,"Dry Vermouth"],["Cinzano Rosso",10],["Grapefruit Juice","top"]]],
  ["Sicilian Kiss", [["Southern Comfort",45],["Amaretto",15],["Lemon Juice",5],["Lime Juice",5]]],
  ["Sourtini", [["Vodka",15],["Lemon Juice",10],["Fresh Lemon","squeeze","Fresh squeeze"],["Grapefruit Juice","top"]]],
  ["Strawberrytini", [["Vodka",15],["Strawberry",30],["Milk","top"]]],
  ["Sunset", [["Gin",45],["Lime Juice",10],["Cranberry Juice","top"]]],
  ["Verry Berry", [["Vodka",15],["Blueberry",15],["Strawberry",15],["Cranberry Juice","top"]]],
  ["Wet Pussy", [["Vodka",30],["Peach",15],["Lime Juice",5],["Cranberry Juice","top"]]],
  ["White Lady", [["Gin",60],["Triple Sec",30],["Lemon Juice",15]]],
  ["Woo Woo", [["Vodka",15],["Cassis",30],["Peach",15],["Cranberry Juice","top"],["Orange Juice","top"]]],
  ["XYZ", [["Bacardi",60],["Triple Sec",30],["Lemon Juice",15]]],
  ["Zoolander", [["Vodka",15],["Passoa",30],["Peach",15],["Lime Juice",5],["Orange Juice","top"]]],
];

// Ingredient families, used to choose believable wrong answers
const FAMILY = {
  spirit: ["Vodka","Gin","Bacardi","Myers","Tequila","Jim Beam","Southern Comfort","Citron Jenever","Cherry Brandy"],
  liqueur: ["Apple Liqueur","Get 27","Baileys","Strawberry","Banana","Blueberry","Blue Curacao","Butterscotch","Kahlua","Frangelico","Triple Sec","Cacao Brown","White Cacao","Mangoyan","Peach","Cassis","Lychee","Melon","Malibu","Passoa","Amaretto"],
  vermouth: ["Dry Vermouth","Cinzano Rosso","Cinzano Bianco","Angostura Bitters"],
  mixer: ["Lime Juice","Lemon Juice","Fresh Lemon","Orange Juice","Pineapple Juice","Cranberry Juice","Grapefruit Juice","Ginger Ale","Milk","Iced Coffee","Oolong Tea"],
  extra: ["Vanilla","Grenadine","Chocolate Syrup","Olive","Olive Brine"],
};
const FAMILY_OF = {};
for (const [f, list] of Object.entries(FAMILY)) for (const k of list) FAMILY_OF[k] = f;

const ML = [5,10,15,20,30,45,60,90,100];
const OTHER = ["dash","drops","squeeze","top"];
const AMOUNTS = [...ML, ...OTHER];
const lab = a => typeof a === "number" ? a + "ml" : ({top:"Top up", dash:"Dash", drops:"Drops", squeeze:"Squeeze"})[a] || "";

const DRINKS = RAW.map(([name, ings, notes = []]) => ({
  name,
  notes,
  ings: ings.map(([n, a, t, k]) => ({ n, a, t: t || lab(a), k: k || n })),
}));
const ALL_KEYS = [...new Set(DRINKS.flatMap(d => d.ings.map(i => i.k)))].sort();

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

function recipeCard(d) {
  const rows = d.ings.map(i => `<li><span>${i.n}</span><span class="amt">${i.t}</span></li>`).join("");
  const notes = d.notes.length
    ? `<div class="rc-n"><b>Finish</b>${d.notes.map(n => `<span class="tag">${n}</span>`).join("")}</div>` : "";
  return `<div class="rc"><div class="rc-h">${d.name}</div><ul class="rc-l">${rows}</ul>${notes}</div>`;
}

// ---------- Tabs ----------
function setMode(mode) {
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", String(t.dataset.mode === mode));
  for (const m of ["study","build","quiz"]) $(m).hidden = m !== mode;
  store.set("cinque-mode", mode);
  if (mode === "build" && !build.d) newBuild(rand(DRINKS));
  if (mode === "quiz" && !quiz.q) nextQuestion();
  window.scrollTo(0, 0);
}
document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (t) setMode(t.dataset.mode);
});

// ---------- Study ----------
let deck = DRINKS.map((_, i) => i), pos = 0, revealed = false;
function renderFlash() {
  const d = DRINKS[deck[pos]];
  $("flashCount").textContent = `${pos + 1} / ${deck.length}`;
  $("flashName").textContent = d.name;
  $("flashName").hidden = revealed;
  $("flashBody").innerHTML = recipeCard(d);
  $("flashBody").hidden = !revealed;
  $("flashHint").textContent = revealed ? "Tap to hide" : "Say the recipe, then tap to check";
}
function toggleFlash() { revealed = !revealed; renderFlash(); }
$("flash").addEventListener("click", toggleFlash);
$("flash").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleFlash(); } });
$("next").addEventListener("click", () => { pos = (pos + 1) % deck.length; revealed = false; renderFlash(); });
$("prev").addEventListener("click", () => { pos = (pos - 1 + deck.length) % deck.length; revealed = false; renderFlash(); });
$("shuffle").addEventListener("click", () => { deck = shuffle(deck); pos = 0; revealed = false; renderFlash(); });

function renderMenu() {
  const q = $("search").value.trim().toLowerCase();
  const list = DRINKS.filter(d => !q || d.name.toLowerCase().includes(q) || d.ings.some(i => i.n.toLowerCase().includes(q) || i.k.toLowerCase().includes(q)));
  $("menuGrid").innerHTML = list.length ? list.map(recipeCard).join("") : `<p class="empty">No drinks match “${q.replace(/[<>&]/g, "")}”.</p>`;
}
$("search").addEventListener("input", renderMenu);
function setStudyView(menu) {
  $("s-cards").classList.toggle("on", !menu);
  $("s-menu").classList.toggle("on", menu);
  $("cardsView").hidden = menu;
  $("menuView").hidden = !menu;
}
$("s-cards").addEventListener("click", () => setStudyView(false));
$("s-menu").addEventListener("click", () => setStudyView(true));

// ---------- Build ----------
const build = { d: null, chips: [], picked: new Set(), phase: "ing", amt: {} };

$("bSelect").innerHTML = `<option value="">Choose a drink…</option>` + DRINKS.map((d, i) => `<option value="${i}">${d.name}</option>`).join("");
$("bSelect").addEventListener("change", e => { if (e.target.value !== "") newBuild(DRINKS[+e.target.value]); });
$("bRandom").addEventListener("click", () => {
  let d; do { d = rand(DRINKS); } while (DRINKS.length > 1 && d === build.d);
  newBuild(d);
});

function makeChips(d) {
  const real = new Set(d.ings.map(i => i.k));
  const set = new Set(real);
  // one look-alike per real ingredient, from the same family
  for (const k of shuffle([...real])) {
    const sib = shuffle(FAMILY[FAMILY_OF[k] || "extra"]).find(x => !set.has(x));
    if (sib) set.add(sib);
  }
  let target = Math.min(12, Math.max(10, real.size * 2 + 2));
  if (target % 2) target++;
  for (const k of shuffle(ALL_KEYS)) { if (set.size >= target) break; set.add(k); }
  return shuffle([...set]);
}

function newBuild(d) {
  Object.assign(build, { d, chips: makeChips(d), picked: new Set(), phase: "ing", amt: {} });
  $("bSelect").value = String(DRINKS.indexOf(d));
  renderBuild();
}

function renderBuild() {
  const { d, chips, picked, phase } = build;
  const real = new Set(d.ings.map(i => i.k));
  const checked = phase !== "ing";
  let h = `<h2 class="dname">${d.name}</h2>`;

  // Step 1
  h += `<div class="step"><div class="step-h"><span class="step-n">Step 1</span>Pick every ingredient</div>`;
  h += `<p class="sub">Tap everything that goes in. Order doesn’t matter.</p><div class="chips">`;
  for (const k of chips) {
    let cls = "chip", mk = "";
    if (!checked) { if (picked.has(k)) cls += " sel"; }
    else if (real.has(k) && picked.has(k)) { cls += " ok"; mk = "✓"; }
    else if (real.has(k)) { cls += " missed"; mk = "missed"; }
    else if (picked.has(k)) { cls += " wrong"; mk = "✕"; }
    else cls += " dim";
    h += `<button class="${cls}" data-chip="${k}" ${checked ? "disabled" : ""} aria-pressed="${picked.has(k)}">${k}${mk ? `<span class="mk">${mk}</span>` : ""}</button>`;
  }
  h += `</div>`;
  if (!checked) {
    h += `<button class="btn" id="checkIng" ${picked.size ? "" : "disabled"}>Check ingredients</button>`;
  } else {
    const found = [...real].filter(k => picked.has(k)).length;
    const missed = [...real].filter(k => !picked.has(k));
    const wrong = [...picked].filter(k => !real.has(k));
    const perfect = !missed.length && !wrong.length;
    let msg = perfect ? `All ${real.size} ingredients, nothing extra.` : `${found} of ${real.size} found.`;
    if (missed.length) msg += ` Missed: ${missed.join(", ")}.`;
    if (wrong.length) msg += ` Not in this drink: ${wrong.join(", ")}.`;
    h += `<p class="fb ${perfect ? "ok" : "bad"}">${msg}</p>`;
  }
  h += `</div>`;

  // Step 2
  if (checked) {
    const rows = d.ings.filter(i => i.a !== null);
    const done = phase === "done";
    h += `<div class="step"><div class="step-h"><span class="step-n">Step 2</span>Set the amounts</div>`;
    rows.forEach(i => {
      const idx = d.ings.indexOf(i);
      const pickedA = build.amt[idx];
      h += `<div class="arow"><div class="aname">${i.n}</div>`;
      if (!done) {
        h += `<div class="abtns">` + AMOUNTS.map(a =>
          `<button class="ab${pickedA === a ? " sel" : ""}" data-row="${idx}" data-amt="${a}">${lab(a)}</button>`).join("") + `</div>`;
      } else {
        const right = pickedA === i.a;
        const note = i.t !== lab(i.a) ? ` (${i.t})` : "";
        h += right
          ? `<div class="ares ok">✓ ${lab(i.a)}${note}</div>`
          : `<div class="ares bad">✕ You chose ${lab(pickedA)}. Correct: <b>${lab(i.a)}</b>${note}</div>`;
      }
      h += `</div>`;
    });
    if (!done) {
      const left = rows.filter(i => build.amt[d.ings.indexOf(i)] === undefined).length;
      h += `<button class="btn" id="checkAmt" ${left ? "disabled" : ""}>${left ? `Choose ${left} more` : "Check amounts"}</button>`;
    }
    h += `</div>`;
  }

  // Result
  if (phase === "done") {
    h += recipeCard(d);
    h += `<div class="row"><button class="btn ghost" id="again">Try again</button><button class="btn red" id="nextDrink">Next drink</button></div>`;
  }
  $("bStage").innerHTML = h;
}

$("bStage").addEventListener("click", e => {
  const chip = e.target.closest("[data-chip]");
  if (chip && build.phase === "ing") {
    const k = chip.dataset.chip;
    build.picked.has(k) ? build.picked.delete(k) : build.picked.add(k);
    renderBuild(); return;
  }
  const ab = e.target.closest("[data-amt]");
  if (ab && build.phase === "amt") {
    const v = ab.dataset.amt;
    build.amt[+ab.dataset.row] = isNaN(+v) ? v : +v;
    renderBuild(); return;
  }
  const id = e.target.closest("button")?.id;
  if (id === "checkIng") { build.phase = "amt"; renderBuild(); }
  if (id === "checkAmt") { build.phase = "done"; renderBuild(); }
  if (id === "again") newBuild(build.d);
  if (id === "nextDrink") $("bRandom").click();
});

// ---------- Quiz ----------
const quiz = { q: null, answered: false, last: "" };

function qAmount() {
  const d = rand(DRINKS);
  const i = rand(d.ings.filter(x => x.a !== null));
  const correct = lab(i.a);
  let wrong;
  if (typeof i.a === "number") {
    wrong = shuffle(ML.filter(n => n !== i.a).sort((x, y) => Math.abs(x - i.a) - Math.abs(y - i.a)).slice(0, 5)).slice(0, 3).map(lab);
  } else {
    wrong = shuffle(["top","dash","drops",15,30].filter(x => x !== i.a)).slice(0, 3).map(lab);
  }
  return { kind: "Amount", text: `How much <b>${i.n}</b> goes in a <b>${d.name}</b>?`, opts: shuffle([correct, ...wrong]), correct, d,
    extra: i.t !== correct ? `The sheet says: ${i.t}` : "" };
}
function qName() {
  const d = rand(DRINKS);
  const keys = new Set(d.ings.map(i => i.k));
  const others = shuffle(DRINKS.filter(x => x !== d))
    .sort((a, b) => b.ings.filter(i => keys.has(i.k)).length - a.ings.filter(i => keys.has(i.k)).length)
    .slice(0, 6);
  const opts = shuffle([d.name, ...shuffle(others).slice(0, 3).map(x => x.name)]);
  const list = `<ul class="qlist">${shuffle(d.ings).map(i => `<li><span>${i.n}</span><span class="amt">${i.t}</span></li>`).join("")}</ul>`;
  return { kind: "Name the drink", text: `Which drink is this?`, list, opts, correct: d.name, d };
}
function qNot() {
  const d = rand(DRINKS.filter(x => x.ings.length >= 3));
  const keys = new Set(d.ings.map(i => i.k));
  const shown = shuffle(d.ings).slice(0, 3);
  const fam = FAMILY[FAMILY_OF[rand(shown).k] || "extra"];
  const odd = shuffle(fam).find(k => !keys.has(k)) || shuffle(ALL_KEYS).find(k => !keys.has(k));
  return { kind: "Odd one out", text: `Which of these is <u>not</u> in a <b>${d.name}</b>?`, opts: shuffle([...shown.map(i => i.n), odd]), correct: odd, d };
}

function nextQuestion() {
  let q;
  do { q = rand([qAmount, qName, qNot])(); } while (q.text + q.correct === quiz.last);
  quiz.q = q; quiz.answered = false; quiz.last = q.text + q.correct;
  renderQuiz();
}

function renderQuiz(choice) {
  const q = quiz.q;
  let h = `<div class="qcard"><div class="qkind">${q.kind}</div><p class="qtext">${q.text}</p>${q.list || ""}<div class="opts">`;
  h += q.opts.map(o => {
    let cls = "opt";
    if (quiz.answered) { if (o === q.correct) cls += " ok"; else if (o === choice) cls += " wrong"; }
    return `<button class="${cls}" data-opt="${o.replace(/"/g, "&quot;")}" ${quiz.answered ? "disabled" : ""}>${o}${quiz.answered && o === q.correct ? " ✓" : ""}${quiz.answered && o === choice && o !== q.correct ? " ✕" : ""}</button>`;
  }).join("");
  h += `</div>`;
  if (quiz.answered) {
    const right = choice === q.correct;
    h += `<p class="fb ${right ? "ok" : "bad"}">${right ? "Correct." : `Not quite. The answer is <b>${q.correct}</b>.`}${q.extra ? " " + q.extra + "." : ""}</p>`;
  }
  h += `</div>`;
  if (quiz.answered) h += recipeCard(q.d);
  h += `<button class="btn ${quiz.answered ? "red" : "ghost"}" id="qNext">${quiz.answered ? "Next question" : "Skip"}</button>`;
  $("qStage").innerHTML = h;
}

$("qStage").addEventListener("click", e => {
  const o = e.target.closest("[data-opt]");
  if (o && !quiz.answered) { quiz.answered = true; renderQuiz(o.dataset.opt); return; }
  if (e.target.closest("#qNext")) { nextQuestion(); window.scrollTo(0, 0); }
});

// ---------- Start ----------
renderFlash();
renderMenu();
const saved = store.get("cinque-mode");
setMode(["study","build","quiz"].includes(saved) ? saved : "study");
</script>

</body>
